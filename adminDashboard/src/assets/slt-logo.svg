<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none">
  <!-- Icon mark: coloured bars -->
  <rect x="6"  y="10" width="9" height="44" rx="4.5" fill="#00A8E1" transform="rotate(-18 6 10)"/>
  <rect x="20" y="6"  width="11" height="52" rx="5.5" fill="#003DA5" transform="rotate(-18 20 6)"/>
  <rect x="37" y="12" width="9"  height="42" rx="4.5" fill="#5CB85C" transform="rotate(-18 37 12)"/>
  <circle cx="34" cy="57" r="5.5" fill="#003DA5"/>

  <!-- Vertical divider -->
  <line x1="70" y1="14" x2="70" y2="66" stroke="#D1D5DB" stroke-width="1.4"/>

  <!-- SLT wordmark -->
  <text x="80" y="52"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="34"
        font-weight="900"
        fill="#003DA5"
        letter-spacing="-1">SLT</text>

  <!-- Sri Lanka Telecom sub-label -->
  <text x="80" y="66"
        font-family="Arial, sans-serif"
        font-size="9.5"
        font-weight="600"
        fill="#5CB85C"
        letter-spacing="2.2">SRI LANKA TELECOM</text>
</svg>
